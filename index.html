<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ignacio Morales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    /* Day/night background — --day is driven by the sun over Barcelona (see daylight.js).
       1 = full daylight (paper white), 0 = night (soft dark). */
    @property --day {
      syntax: '<number>';
      inherits: true;
      initial-value: 1;
    }

    :root {
      --day: 1;
      --paper: #f6f1e7;
      --dusk: #1e1d1b;
  /* Text flips between near-black and near-white at the exact point where the background
    gives both equal contrast (--day 0.462), so it never blends into the background. */
  --ink-dark: #0d0b09;
  --ink-light: #fffaf2;
  --ink-mix: calc(clamp(0, (var(--day) - 0.462) * 1000, 1) * 100%);
  --ink: color-mix(in srgb, var(--ink-dark) var(--ink-mix), var(--ink-light));
      --bg: color-mix(in oklab, var(--paper) calc(var(--day) * 100%), var(--dusk));
      transition: --day 3s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: #0d0b09;
      color: var(--ink);
    }
    /* Full-screen scenes: Nacho breathing, then coding with his AI agent, then playing guitar. */
    .scene {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-items: center;
      overflow: hidden;
    }
    /* Greeting above Nacho, typed like an old game; the last dot blinks like a cursor. */
    .hero { display: grid; justify-items: center; gap: 28px; }
    .greeting {
      font-family: 'Press Start 2P', ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: clamp(11px, 4.4vw, 22px);
      line-height: 1.4;
      color: var(--ink);
      white-space: nowrap;
      text-align: center;
    }
    .greeting .cursor.off { visibility: hidden; }

    /* Taller than the screen so the page has room to outrun him before the next scene. */
    .scene--intro { display: block; min-height: 150vh; min-height: 150svh; overflow: visible; }
    .stage {
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
    }
    .scene--code { justify-items: start; padding-left: max(16px, 6vw); }
    .scene--guitar { justify-items: end; padding-right: max(16px, 6vw); }

    /* Sprite sheets: frames in a row, drawn at a whole-number scale so pixels stay crisp. */
    .sprite {
      --scale: 5;
      width: calc(var(--frame) * var(--scale));
      height: calc(var(--frame) * var(--scale));
      overflow: hidden;
    }
    .sprite img {
      display: block;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Every sheet uses 72x72 frames at 200 ms each. Frames are advanced by script (see the end
       of the page), not a CSS animation: iOS Safari can run transform animations on the GPU,
       ignore steps(), and slide the sheet so halves of two frames show at once. */
    .sprite { --frame: 72px; }
    .sprite img[data-frames="13"] { width: 1300%; }
    .sprite img[data-frames="8"]  { width: 800%; }

    /* While the page scrolls he walks; when it stops he breathes again. */
    .sprite--stand .walk { display: none; }
    .sprite--stand.is-walking .walk { display: block; }
    .sprite--stand.is-walking .breathe { display: none; }

    /* Later scenes rise into view. */
    .reveal {
      opacity: 0;
      transform: translateY(48px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.is-visible { opacity: 1; transform: none; }

    @media (max-width: 420px), (max-height: 480px) { .sprite { --scale: 4; } }
    @media (max-height: 360px) { .sprite { --scale: 3; } }

    /* Finale: Nacho in front of Barcelona, the sea and the Sagrada Familia.
       One scale for everything: --fs screen pixels per Nacho pixel; the backdrop is drawn at half that
       (fs/2), as a distant layer, keeping the original picture's proportions between him and the city.
       fs is always a multiple of 4 so every pixel lands on whole screen pixels. The backdrop is 416x100
       pixels, anchored on the city. */
    .bcn {
      --fs: 4;
      --glow: clamp(0, 1 - max(var(--day) - 0.5, 0.5 - var(--day)) / 0.35, 1);  /* peaks at dawn and dusk */
      position: relative;
      height: calc(50px * var(--fs) + clamp(140px, 32vh, 360px));
      overflow: hidden;
      container-type: size;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%);
      mask-image: linear-gradient(to bottom, transparent, #000 35%);
    }
    .bcn-art {
      position: absolute;
      bottom: 0;
      width: calc(208px * var(--fs));
      height: calc(50px * var(--fs));
      left: calc((100cqw - 208px * var(--fs)) * 0.85);
    }
    .bcn-art > * { position: absolute; }
    .bcn-backdrop, .bcn-skyfill {
      filter: brightness(calc(0.8 + 0.35 * var(--day))) saturate(calc(0.8 + 0.3 * var(--day)));
    }
    .bcn-backdrop {
      inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
      /* The top rows melt into the plain sky above, so there is no edge. */
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%);
      mask-image: linear-gradient(to bottom, transparent, #000 22%);
    }
    /* The backdrop starts just above Nacho's head; plain sky (the average of its top rows) continues above. */
    .bcn-skyfill { left: 0; right: 0; bottom: 0; height: 100cqh; background: #393138; }
    .bcn-sea { left: 30.288%; top: 61%; width: 51.442%; height: 16%; image-rendering: pixelated; }
    .bcn-sky { left: 0; top: -45.115%; width: 100%; height: 260%; image-rendering: pixelated; }
    .bcn-light { left: 0; right: 0; bottom: 0; height: 100cqh; pointer-events: none; }
    .bcn-light--noon  { background: linear-gradient(#cfe4ff, #fff6e0); mix-blend-mode: soft-light; opacity: calc(var(--day) * 0.55); }
    .bcn-light--glow  { background: linear-gradient(to top, #ff9a52, #ff6f7d 45%, transparent 80%); mix-blend-mode: soft-light; opacity: calc(var(--glow) * 0.65); }
    .bcn-light--night { background: #141c3d; mix-blend-mode: multiply; opacity: calc((1 - var(--day)) * 0.55); }

    /* Nacho sits inside the backdrop, under the same light, haze and colour as the city, so day, dusk
       and night grade him with it. Positions are in his pixels (fs), measured from where his art starts,
       which lines up with the page gutter: in his 72x72 cell the art spans x 23-50 with 14 px under his
       feet. The grass line is 3 px up. */
    .bcn-family {
      left: calc(max(16px, 6vw) - (100cqw - 208px * var(--fs)) * 0.85);
      bottom: 0;
    }
    .bcn-family > * { position: absolute; }
    .bcn-family .sprite--nacho { --scale: var(--fs);           left: calc(-23px * var(--fs));    bottom: calc((3 - 14) * var(--fs) * 1px); }
    /* Pixel contact shadow on Nacho's grid, centred under him on the grass line. */
    .bcn-shadow { image-rendering: pixelated; }
    .bcn-shadow--nacho { left: calc(1.5px * var(--fs));  bottom: calc(1px * var(--fs));   width: calc(24px * var(--fs)); height: calc(4px * var(--fs)); }

    /* Aerial perspective: the far city and sea sit behind a thin haze in the sky's colour, strongest at
       the horizon and gone by the foreground grass, so Nacho reads as closer. */
    .bcn-haze {
      left: 0; right: 0; top: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent 15%, var(--haze) 58%, var(--haze) 66%, transparent 88%);
      --haze: color-mix(in oklab, #e6e0ee calc(var(--day) * 100%), #262b48);
      opacity: 0.28;
      pointer-events: none;
    }

    /* Smallest multiple of 4 that makes the 208-pixel-wide backdrop cover the screen. */
    @media (min-width: 833px)  { .bcn { --fs: 8; } }
    @media (min-width: 1665px) { .bcn { --fs: 12; } }
    @media (min-width: 2497px) { .bcn { --fs: 16; } }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
  <script>
    // Sets --day on <html> from the sun's height over Barcelona:
    // 1 = daylight (paper white), 0 = night (soft dark), blending through dawn and dusk.
    // Preview a value with ?day=0.3 or a Barcelona time with ?bcn=21:30.
    (function () {
      var LAT = 41.3874, LON = 2.1686, RAD = Math.PI / 180;

      function sunElevation(date) {
        var d = date.getTime() / 86400000 - 10957.5; // days since J2000
        var g = (357.529 + 0.98560028 * d) * RAD;
        var q = 280.459 + 0.98564736 * d;
        var L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
        var e = (23.439 - 0.00000036 * d) * RAD;
        var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
        var dec = Math.asin(Math.sin(e) * Math.sin(L));
        var gmst = 280.46061837 + 360.98564736629 * d;
        var ha = (gmst + LON) * RAD - ra;
        var lat = LAT * RAD;
        return Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha)) / RAD;
      }

      // Full night below -10° (deep twilight), full day above +8°.
      function dayFactor(elev) {
        var t = Math.min(1, Math.max(0, (elev + 10) / 18));
        return t * t * (3 - 2 * t);
      }

      // Convert a Barcelona wall-clock time (today) to a Date.
      function barcelonaTime(hhmm) {
        var m = /^(\d{1,2}):?(\d{2})?$/.exec(hhmm);
        if (!m) return null;
        var now = new Date();
        var parts = {};
        new Intl.DateTimeFormat('en-US', {
          timeZone: 'Europe/Madrid', hourCycle: 'h23',
          year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric'
        }).formatToParts(now).forEach(function (p) { parts[p.type] = +p.value; });
        var asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute);
        var offset = asUTC - Math.floor(now.getTime() / 60000) * 60000; // Barcelona's UTC offset
        return new Date(Date.UTC(parts.year, parts.month - 1, parts.day, +m[1], +(m[2] || 0)) - offset);
      }

      var params = new URLSearchParams(location.search);
      var forced = params.has('day') ? parseFloat(params.get('day')) : NaN;
      var at = params.has('bcn') ? barcelonaTime(params.get('bcn')) : null;

      function update() {
        var day = !isNaN(forced) ? Math.min(1, Math.max(0, forced)) : dayFactor(sunElevation(at || new Date()));
        document.documentElement.style.setProperty('--day', day.toFixed(3));
      }

      update();
      setInterval(update, 60000);
    })();
  </script>
</head>
<body>
  <main>
    <section class="scene scene--intro">
      <div class="stage">
        <div class="hero" id="hero">
        <p class="greeting">Hi! I'm Nacho..<span class="cursor" id="cursor">.</span></p>
        <div class="sprite sprite--stand" id="intro" role="img" aria-label="Nacho, standing and breathing, walks down as you scroll">
          <img class="breathe" src="assets/stand.png" data-frames="13" alt="" />
          <img class="walk" src="assets/walk.png" data-frames="8" alt="" />
        </div>
        </div>
      </div>
    </section>
    <section class="scene scene--code">
      <div class="sprite sprite--code reveal"><img src="assets/code.png" data-frames="8" alt="Nacho on his laptop, talking to an AI agent that codes for him" /></div>
    </section>
    <section class="scene scene--guitar">
      <div class="sprite sprite--guitar reveal"><img src="assets/guitar.png" data-frames="13" alt="Nacho sitting on the grass, playing guitar and singing" /></div>
    </section>
    <section class="bcn" id="barcelona" aria-label="Nacho on a hill above Barcelona">
      <div class="bcn-art">
        <div class="bcn-skyfill"></div>
        <img class="bcn-backdrop" src="assets/barcelona.png" alt="" />
        <canvas class="bcn-sea" width="214" height="16" data-mask="assets/barcelona-sea-mask.png" aria-hidden="true"></canvas>
        <div class="bcn-haze"></div>
        <div class="bcn-family">
          <img class="bcn-shadow bcn-shadow--nacho" src="assets/shadow-nacho.png" alt="" />
          <div class="sprite sprite--nacho"><img src="assets/stand.png" data-frames="13" alt="Nacho" /></div>
        </div>
        <div class="bcn-light bcn-light--noon"></div>
        <div class="bcn-light bcn-light--glow"></div>
        <div class="bcn-light bcn-light--night"></div>
        <canvas class="bcn-sky" width="416" height="260" data-mask="assets/barcelona-sky-mask.png" aria-hidden="true"></canvas>
      </div>
    </section>
  </main>
  <script src="assets/barcelona.js?v=2" defer></script>
  <script>
    (function () {
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Intro: walk down at half the scroll speed, so the page outruns him; breathe when it stops.
      var intro = document.getElementById('intro');
      var hero = document.getElementById('hero');
      var ticking = false, rest;
      function sink() {
        ticking = false;
        hero.style.transform = 'translateY(' + (window.scrollY * 0.5).toFixed(1) + 'px)';
      }
      if (!still) {
        addEventListener('scroll', function () {
          if (!ticking) { ticking = true; requestAnimationFrame(sink); }
          intro.classList.add('is-walking');
          clearTimeout(rest);
          rest = setTimeout(function () { intro.classList.remove('is-walking'); }, 250);
        }, { passive: true });
        sink();
      }

      // Sprite sheets: show one whole frame every 200 ms by moving the sheet a frame at a time.
      var sheets = [].slice.call(document.querySelectorAll('.sprite img[data-frames]'));
      var tick = 0;
      function step() {
        sheets.forEach(function (img) {
          var n = +img.dataset.frames;
          img.style.transform = 'translateX(' + (-(tick % n) * 100 / n) + '%)';
        });
        tick++;
      }
      step();
      if (!still) setInterval(step, 200);

      // The last dot blinks twice a second, like the cursor in an old text box.
      var cursor = document.getElementById('cursor');
      if (!still) setInterval(function () { cursor.classList.toggle('off'); }, 500);

      // Later scenes: fade and rise in once they are on screen.
      var reveal = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); reveal.unobserve(e.target); }
        });
      }, { threshold: 0.35 });
      document.querySelectorAll('.reveal').forEach(function (el) { reveal.observe(el); });
    })();
  </script>
</body>
</html>
