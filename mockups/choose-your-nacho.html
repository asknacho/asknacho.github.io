<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Choose Your Nacho</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root { --sky:#1c1448; --ink:#fff; --gold:#f8d858; --win1:#3c5cd8; --win2:#121c78; --mute:#b8c4f0; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--sky); color:var(--ink); overflow-x:clip; }
  body { min-height:100vh; display:flex; flex-direction:column; font-family:'VT323',monospace; position:relative; overflow-x:hidden; }
  #sky { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:20% bottom; image-rendering:pixelated; }
  main { position:relative; flex:1; display:flex; flex-direction:column; max-width:1240px; width:100%; margin:auto; padding:clamp(16px,3vh,32px) 16px 20px; gap:clamp(8px,2vh,20px); }
  .head { text-align:center; }
  h1 { font-family:'Press Start 2P',monospace; font-weight:400; margin:0; font-size:clamp(22px,5vw,56px); line-height:1.15; color:var(--gold); text-shadow:0 4px 0 #c04828, 0 8px 0 #4c1c58; }
  .who { font-size:clamp(20px,2.6vw,28px); margin:14px 0 0; }
  .who b { color:var(--gold); font-weight:400; }
  .party { flex:1; display:grid; grid-template-columns:repeat(7,1fr); align-items:end; gap:4px; min-height:230px; }
  .slot { all:unset; cursor:pointer; position:relative; text-align:center; padding-top:30px; }
  .slot:focus-visible .tag { outline:3px solid #fff; }
  .slot canvas { display:block; width:136%; max-width:none; margin-left:-18%; image-rendering:pixelated; transition:transform .1s steps(3); filter:brightness(.72) saturate(.8); pointer-events:none; }
  .slot .bob { animation:bob 1.1s steps(2) infinite; }
  .slot:nth-child(2n) .bob { animation-delay:-.4s; }
  .slot.on canvas { transform:translateY(-10px) scale(1.12); filter:none; }
  .tag { font-family:'Press Start 2P',monospace; font-size:clamp(7px,.9vw,11px); line-height:1.4; padding:6px 2px; display:block; color:#fff; background:rgba(10,8,40,.72); margin-top:6px; }
  .slot.on .tag { color:#000; background:var(--gold); }
  .hand { position:absolute; top:0; left:50%; transform:translateX(-50%); width:32px; opacity:0; image-rendering:pixelated; animation:poke .5s steps(2) infinite; }
  .slot.on .hand { opacity:1; }
  @keyframes bob { 50% { transform:translateY(-3px); } }
  @keyframes poke { 50% { margin-top:5px; } }
  .win { background:linear-gradient(180deg,var(--win1),var(--win2)); border:4px solid #e8ecf8; border-radius:8px; box-shadow:inset 0 0 0 3px #586cc8, 0 0 0 3px #181838, 6px 8px 0 3px rgba(0,0,0,.35); padding:clamp(14px,2vh,20px); display:grid; grid-template-columns:1.1fr 1fr 1.3fr; gap:20px; }
  .win h2 { font-family:'Press Start 2P',monospace; font-weight:400; margin:0 0 8px; font-size:clamp(14px,1.7vw,20px); line-height:1.3; color:var(--gold); text-shadow:2px 2px 0 #101850; }
  .class { font-size:24px; margin:0 0 8px; color:var(--mute); }
  .bio { font-size:25px; line-height:1.08; margin:0 0 12px; }
  .stat { display:grid; grid-template-columns:96px 1fr 40px; align-items:center; gap:8px; font-size:24px; line-height:1.3; }
  .bar { height:12px; background:#08103c; border:2px solid #e8ecf8; }
  .bar i { display:block; height:100%; background:linear-gradient(180deg,#a8f878,#38b050); transition:width .25s steps(6); }
  .bar.low i { background:linear-gradient(180deg,#f8a080,#d03830); }
  .lbl { font-family:'Press Start 2P',monospace; font-size:10px; color:var(--mute); margin:0 0 6px; }
  .techs { list-style:none; margin:0 0 10px; padding:0; font-size:24px; line-height:1.1; }
  .techs li::before { content:'✦ '; color:var(--gold); }
  .weak { font-size:24px; margin:0 0 10px; line-height:1.05; }
  .weak span { color:#ffa890; }
  .cta { display:flex; flex-wrap:wrap; gap:10px; }
  .cta a { font-family:'Press Start 2P',monospace; font-size:10px; color:#000; background:var(--gold); padding:10px; text-decoration:none; box-shadow:0 3px 0 #a87818; }
  .cta a:hover { background:#fff; }
  .cta a.ghost { background:transparent; color:#fff; box-shadow:inset 0 0 0 2px #fff; }
  @media (max-width:860px) {
    .party { grid-template-columns:repeat(4,1fr); }
    .win { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<canvas id="sky" width="320" height="200"></canvas>
<main>
  <div class="head">
    <h1>CHOOSE YOUR NACHO</h1>
    <p class="who">Ignacio Morales · Tech Lead · Barcelona · <b>LV 8+</b> · All six are available for hire as one unit</p>
  </div>
  <div class="party" id="party" role="listbox" aria-label="Nacho classes"></div>
  <section class="win" aria-live="polite">
    <div>
      <h2 id="name"></h2>
      <p class="class" id="cls"></p>
      <p class="bio" id="bio"></p>
    </div>
    <div id="stats"></div>
    <div>
      <p class="lbl">TECHS</p>
      <ul class="techs" id="techs"></ul>
      <p class="weak"><span>WEAK TO:</span> <i id="weak" style="font-style:normal"></i></p>
      <div class="cta" id="cta"></div>
    </div>
  </section>
</main>

<script src="sprites.js"></script>
<script>
const LI = ['RECRUIT ON LINKEDIN', 'https://www.linkedin.com/in/ignaciomoralesm'];
const GH = ['GITHUB', 'https://github.com/ignaciomoralesm'];
const CLASSES = [
  { id: 'dev', name: 'NACHO', tag: 'TECH LEAD', cls: 'Class: Senior Software Engineer',
    bio: '8+ years shipping. Led 8 engineers on a platform for 2M+ users. Cut deploy times by 60%.',
    stats: [['CODE', 92], ['LEAD', 88], ['MEETINGS', 21]], techs: ['Refactor All', 'Ship Friday (forbidden)', 'Mentor Beam: 2 promotions'], weak: '"Quick question?"', links: [LI, GH] },
  { id: 'bard', name: 'NACHO', tag: 'BARD', cls: 'Class: Guitarist, Apprentice Pianist',
    bio: 'Plays guitar. Is learning piano. Built scorepace.com rather than simply practising.',
    stats: [['GUITAR', 74], ['PIANO', 16], ['RHYTHM', 60]], techs: ['Power Chord', 'Sight-Read (charging...)', 'Scorepace: party practice +1'], weak: 'Left hand', links: [['PLAY SCOREPACE', 'https://scorepace.com']] },
  { id: 'dad', name: 'NACHO', tag: 'DAD', cls: 'Class: Paladin of the Household',
    bio: 'Husband to a wonderful wife, dad to a beautiful daughter. Party grows soon.',
    stats: [['LOVE', 99], ['PATIENCE', 70], ['SLEEP', 12]], techs: ['Piggyback', 'Bedtime Story x9', 'Find the Lost Toy'], weak: 'One more episode', links: [] },
  { id: 'striker', name: 'NACHO', tag: 'STRIKER', cls: 'Class: Barcelona Resident, Football Scholar',
    bio: 'Lives in Barcelona and likes football, which here counts as a personality.',
    stats: [['OPINIONS', 99], ['TACTICS', 80], ['CARDIO', 19]], techs: ['Armchair VAR', 'Offside Explained With Salt Shakers', 'Late Run'], weak: 'Extra time on a school night', links: [] },
  { id: 'chef', name: 'NACHO', tag: 'PIZZAIOLO', cls: 'Class: Pizza Evaluator, Grade S',
    bio: 'Loves pizza with the seriousness others reserve for system design.',
    stats: [['DOUGH', 66], ['CHEESE', 97], ['RESTRAINT', 8]], techs: ['Extra Cheese', 'Fold Technique', 'Crust Reclamation'], weak: 'Pineapple', links: [] },
  { id: 'coach', name: 'NACHO', tag: 'COACH', cls: 'Class: Challenger of People',
    bio: 'Helps people challenge themselves. Will ask whether that really was your best attempt.',
    stats: [['COURAGE', 90], ['HONESTY', 94], ['CHILL', 30]], techs: ['Uncomfortable Question', 'Stretch Goal', 'You Can Do One More'], weak: 'People saying "I can\'t"', links: [LI] },
  { id: 'mystery', name: '???', tag: 'JOINS SOON', cls: 'Class: Unknown (baby boy)',
    bio: 'A new party member is on the way. Patch notes unavailable. Release date set by the customer.',
    stats: [['CUTENESS', 99], ['VOLUME', 95], ['PARTY SLEEP', 2]], techs: ['Midnight Summon', 'Sleep Drain (all allies)', 'Instant Heart Melt'], weak: 'Nothing yet', links: [] },
];

function mystery() {
  const c = document.createElement('canvas'); c.width = 44; c.height = 36;
  const g = c.getContext('2d');
  SPR.draw(g, SPRITES.kid, 16, 20, new Proxy({}, { get: () => '#141030' }));
  g.fillStyle = '#f8d858';
  g.font = '12px "Press Start 2P", monospace'; g.textAlign = 'center';
  return c;
}

const party = document.getElementById('party');
const handUrl = SPR.dataURL(['..kkk..', '.kwwwk.', '.kwwwk.', '.kwwwk.', 'kkwwwkk', 'kwwwwwk', '.kwwwk.', '..kwk..', '...k...']);
CLASSES.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'slot'; b.setAttribute('role', 'option'); b.dataset.i = i;
  const art = c.id === 'mystery' ? mystery() : SPR.pose(c.id);
  art.className = 'bob';
  const hand = new Image(); hand.src = handUrl; hand.className = 'hand'; hand.alt = '';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = c.tag;
  b.append(hand, art, tag);
  b.addEventListener('mouseenter', () => pick(i, true));
  b.addEventListener('focus', () => pick(i, true));
  b.addEventListener('click', () => pick(i, true));
  party.append(b);
});

let audio, current = -1, touched = false;
function blip() {
  if (!touched) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.setValueAtTime(.04, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .07);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .07);
  } catch (_) {}
}

function pick(i, byUser) {
  if (byUser) touched = true;
  if (i === current) return;
  current = i;
  const c = CLASSES[i];
  [...party.children].forEach((el, n) => { el.classList.toggle('on', n === i); el.setAttribute('aria-selected', n === i); });
  document.getElementById('name').textContent = c.name + ' / ' + c.tag;
  document.getElementById('cls').textContent = c.cls;
  document.getElementById('bio').textContent = c.bio;
  document.getElementById('weak').textContent = c.weak;
  document.getElementById('stats').innerHTML = '<p class="lbl">STATS</p>' + c.stats.map(([n, v]) =>
    `<div class="stat"><span>${n}</span><div class="bar ${v < 25 ? 'low' : ''}"><i style="width:${v}%"></i></div><span>${v}</span></div>`).join('');
  document.getElementById('techs').innerHTML = c.techs.map(t => `<li>${t}</li>`).join('');
  document.getElementById('cta').innerHTML = c.links.map(([l, h], n) => `<a class="${n ? 'ghost' : ''}" href="${h}" target="_blank" rel="noopener">${l}</a>`).join('');
  blip();
}

addEventListener('keydown', e => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!d) return;
  e.preventDefault();
  party.children[(current + d + CLASSES.length) % CLASSES.length].focus();
});

pick(0);
const cycle = setInterval(() => touched ? clearInterval(cycle) : pick((current + 1) % CLASSES.length), 3500);

const sky = document.getElementById('sky'), g = sky.getContext('2d');
function paintSky() {
  const W = 320, H = 200;
  const bands = ['#1c1448', '#2c1c60', '#482474', '#702c80', '#a03c7c', '#d05868', '#f08850', '#f8b850'];
  const bh = 16;
  bands.forEach((c, i) => {
    g.fillStyle = c; g.fillRect(0, i * bh, W, bh);
    if (bands[i + 1]) { g.fillStyle = bands[i + 1]; for (let y = 0; y < 5; y++) for (let x = (y % 2) * 2; x < W; x += 2 + (4 - y)) g.fillRect(x, (i + 1) * bh - 5 + y, 1, 1); }
  });
  g.fillStyle = '#fff';
  for (let i = 0; i < 70; i++) g.fillRect((i * 97) % W, (i * 53) % 60, 1, 1);
  g.fillStyle = '#f8e088'; g.beginPath(); g.arc(238, 118, 20, 0, 7); g.fill();
  g.fillStyle = '#2c1c58';
  for (let x = 0, i = 0; x < W; i++) { const w = 8 + (i * 7) % 15, h = 22 + (i * 13) % 26; g.fillRect(x, 170 - h, w, h + 40); x += w; }
  g.fillStyle = '#f8c838';
  for (let i = 0; i < 90; i++) g.fillRect((i * 31) % W, 132 + (i * 17) % 34, 1, 1);
  g.fillStyle = '#20143e';
  [[40, 60, 6], [50, 44, 7], [62, 48, 7], [73, 66, 6]].forEach(([x, y, w]) => {
    g.fillRect(x, y, w, 120); for (let i = 0; i < 6; i++) g.fillRect(x + i / 2 | 0, y - 6 + i, w - i | 0, 1);
    g.fillStyle = '#f8c838'; g.fillRect(x + w / 2 | 0, y - 8, 1, 2); g.fillStyle = '#20143e';
  });
  g.fillRect(36, 118, 46, 60);
  g.fillStyle = '#150c2c'; g.fillRect(0, 172, W, 30);
  g.fillStyle = '#2a1c48'; g.fillRect(0, 172, W, 2);
}
paintSky();
</script>
</body>
</html>
